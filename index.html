<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulheres que Voam — Eventos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --olive-deep:#5c6146;
    --olive:#838762;
    --olive-soft:#a7ab8c;
    --sage:#6fa876;
    --sage-dark:#4f8759;
    --cream:#fcf9f4;
    --cream-dim:#ece6d5;
    --ink:#3a3c2c;
    --gold:#c79a56;
    --rose:#a85c48;
    --rose-dark:#8c4634;
    --line:rgba(92,97,70,0.16);
    --shadow:0 6px 20px rgba(63,66,44,0.10);
    --radius:14px;
  }
  html, body { margin:0; background:var(--cream); font-family:'Inter', sans-serif; color:var(--ink); }
  .display { font-family:'Josefin Sans', sans-serif; }
  #root:empty::before { content:'Carregando catálogo...'; color:var(--olive); display:block; padding:40px; }

  .card {
    position:relative;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card::before, .card::after {
    content:''; position:absolute; width:22px; height:22px; background:var(--cream);
    border-radius:50%; top:50%; transform:translateY(-50%); z-index:2;
  }
  .card::before { left:-11px; }
  .card::after { right:-11px; }
  .card.is-finalizado { filter:grayscale(1); }
  .card.is-pausado { opacity:.72; }
  .ribbon {
    position:absolute; top:16px; left:-34px; width:160px; text-align:center;
    background:var(--rose-dark); color:#fff; font-size:.68rem; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; padding:5px 0; transform:rotate(-40deg);
    box-shadow:0 2px 6px rgba(0,0,0,.25); z-index:3;
  }
  .ribbon.ribbon-pausado { background:var(--gold); }
  .card-img { width:150px; flex-shrink:0; object-fit:cover; display:block; background:var(--cream-dim); }
  .card-img-placeholder {
    width:150px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--cream-dim);
  }
  .perf { width:4px; flex-shrink:0; background-image: radial-gradient(circle, var(--line) 1.5px, transparent 1.5px); background-size:8px 8px; }
  .btn-primary { background:var(--olive-deep); color:var(--cream); transition:transform .15s ease, background .15s ease, box-shadow .15s ease; box-shadow:0 2px 8px rgba(63,66,44,.15); }
  .btn-primary:hover { background:var(--olive); transform:translateY(-1px); box-shadow:0 4px 14px rgba(63,66,44,.22); }
  .btn-primary:active { transform:translateY(0); }
  .btn-disabled { background:var(--olive-soft); color:var(--cream); cursor:default; }
  .btn-outline { border:1.5px solid var(--line); color:var(--olive-deep); background:#fff; transition:all .15s ease; }
  .btn-outline:hover { background:var(--olive-deep); border-color:var(--olive-deep); color:#fff; transform:translateY(-1px); }
  .btn-instagram {
    background:#fff; color:var(--olive-deep); border:1.5px solid var(--line);
    transition:all .2s ease;
  }
  .btn-instagram svg { transition:color .2s ease; }
  .btn-instagram:hover {
    border-color:transparent; color:#fff;
    background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
    transform:translateY(-1px); box-shadow:0 6px 16px rgba(238,42,123,.25);
  }
  .brand-logo { height:56px; width:auto; flex-shrink:0; }
  @media(min-width:768px){ .brand-logo{ height:76px; } }

  /* ---------- Carrossel de destaques ---------- */
  .destaques-wrap {
    position:relative; border-radius:16px; overflow:hidden;
    box-shadow:0 8px 24px rgba(63,66,44,.14);
    aspect-ratio:21/9; background:var(--olive-deep);
  }
  .destaque-slide {
    position:absolute; inset:0; background-size:cover; background-position:center;
    opacity:0; transform:translateX(28px); transition:opacity .55s ease, transform .55s ease;
    pointer-events:none; display:flex; align-items:flex-end;
  }
  .destaque-slide.active { opacity:1; transform:translateX(0); pointer-events:auto; }
  .destaque-slide.clickable { cursor:pointer; }
  .destaque-slide .destaque-overlay {
    width:100%; padding:18px 20px 16px;
    background:linear-gradient(0deg, rgba(20,21,13,.72) 0%, rgba(20,21,13,.32) 55%, rgba(20,21,13,0) 100%);
  }
  .destaque-slide .destaque-titulo {
    font-family:'Josefin Sans', sans-serif; color:#fff; font-weight:500;
    font-size:1.15rem; line-height:1.25; margin:0 0 3px; text-shadow:0 1px 6px rgba(0,0,0,.25);
  }
  .destaque-slide .destaque-subtitulo {
    color:rgba(255,255,255,.88); font-size:.78rem; margin:0;
  }
  @media(min-width:640px){
    .destaque-slide .destaque-overlay{ padding:28px 34px 24px; }
    .destaque-slide .destaque-titulo{ font-size:1.7rem; }
    .destaque-slide .destaque-subtitulo{ font-size:.92rem; }
  }
  .destaques-dots {
    position:absolute; left:0; right:0; bottom:8px; display:flex; justify-content:center; gap:6px; z-index:5;
  }
  .destaques-dots button {
    width:7px; height:7px; border-radius:999px; border:none; background:rgba(255,255,255,.45);
    padding:0; cursor:pointer; transition:all .2s ease;
  }
  .destaques-dots button.active { background:#fff; width:20px; }
  .destaques-arrow {
    position:absolute; top:50%; transform:translateY(-50%); z-index:5;
    width:32px; height:32px; border-radius:50%; border:none; background:rgba(20,21,13,.35);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .15s ease; backdrop-filter:blur(2px);
  }
  .destaques-arrow:hover{ background:rgba(20,21,13,.55); }
  .destaques-arrow.prev{ left:10px; } .destaques-arrow.next{ right:10px; }
  @media(max-width:480px){
    .destaques-arrow{ width:26px; height:26px; background:rgba(20,21,13,.3); }
  }

  .input-field { border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:.9rem; width:100%; }
  .input-field:focus { outline:2px solid var(--gold); outline-offset:1px; }
  .modal-enter { animation: modalIn .18s ease-out; }
  @keyframes modalIn { from { opacity:0; transform: scale(.97); } to { opacity:1; transform: scale(1); } }

  /* ---------- Abas Eventos / Loja ---------- */
  .tab-btn {
    flex:1; text-align:center; padding:12px 10px; border-radius:999px; font-weight:600; font-size:.9rem;
    border:1.5px solid var(--line); color:var(--olive-deep); background:#fff;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
  }
  .tab-btn:hover:not(.active) { background:var(--cream-dim); border-color:var(--olive-soft); color:var(--olive-deep); transform:translateY(-1px); }
  .tab-btn.active { background:var(--olive-deep); color:var(--cream); border-color:var(--olive-deep); }

  /* ---------- Produtos ---------- */
  .produto-card {
    background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .2s ease, transform .2s ease;
  }
  .produto-card:hover { box-shadow:0 12px 28px rgba(63,66,44,.16); transform:translateY(-2px); }

  .produto-img-wrap { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:var(--cream-dim); }
  .produto-img { width:100%; height:100%; object-fit:cover; background:var(--cream-dim); display:block; cursor:zoom-in; transition:transform .3s ease; }
  .produto-img-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--cream-dim); }
  .produto-zoom-btn {
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:999px;
    background:rgba(58,60,44,.55); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
    font-size:.85rem; backdrop-filter:blur(2px); transition:background .15s ease;
  }
  .produto-zoom-btn:hover { background:rgba(58,60,44,.85); }
  .produto-nav-btn {
    position:absolute; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:999px;
    background:rgba(255,255,255,.85); color:var(--olive-deep); border:none; font-size:.85rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .produto-nav-prev { left:8px; }
  .produto-nav-next { right:8px; }
  .produto-dots { position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; gap:4px; }
  .produto-dots span { width:5px; height:5px; border-radius:999px; background:rgba(255,255,255,.6); }
  .produto-dots span.active { background:#fff; width:14px; }

  .qty-stepper { display:flex; align-items:center; border:1.5px solid var(--line); border-radius:999px; overflow:hidden; background:var(--cream); }
  .qty-stepper button { width:30px; height:30px; background:transparent; color:var(--olive-deep); font-size:1rem; font-weight:700; line-height:1; border:none; transition:background .15s ease; }
  .qty-stepper button:hover { background:var(--cream-dim); }
  .qty-stepper button:active { background:var(--olive-soft); color:#fff; }
  .qty-stepper span { width:28px; text-align:center; font-size:.88rem; font-weight:600; }

  /* ---------- Carrinho flutuante (drawer) ---------- */
  .cart-drawer {
    position:fixed; z-index:46; right:20px; bottom:20px; width:380px; max-width:calc(100vw - 28px);
    background:#fff; border-radius:18px; box-shadow:0 16px 42px rgba(63,66,44,.30); border:1px solid var(--line);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .cart-drawer-header {
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; cursor:pointer;
    background:linear-gradient(135deg, var(--olive-deep), #4a4e37); color:var(--cream); border:none; width:100%;
    font-weight:600; font-size:.9rem; transition:filter .15s ease;
  }
  .cart-drawer-header:hover { filter:brightness(1.08); }
  .cart-drawer-header .badge { background:var(--rose); color:#fff; border-radius:999px; min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; padding:0 5px; }
  .cart-drawer-chevron { transition:transform .25s ease; display:inline-block; font-size:.8rem; }
  .cart-drawer.expanded .cart-drawer-chevron { transform:rotate(180deg); }
  .cart-drawer-body { max-height:min(62vh, 520px); overflow-y:auto; padding:16px 18px; display:none; }
  .cart-drawer.expanded .cart-drawer-body { display:block; animation:fade .2s ease; }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }
  @media(max-width:640px){
    .cart-drawer { left:12px; right:12px; width:auto; bottom:12px; }
    .cart-drawer-body { max-height:64vh; }
  }

  /* ---------- Lightbox / zoom ---------- */
  .lightbox-overlay { position:fixed; inset:0; background:rgba(20,21,14,.92); z-index:80; display:flex; align-items:center; justify-content:center; }
  .lightbox-img-wrap { position:relative; width:100%; max-width:560px; aspect-ratio:1/1; overflow:hidden; border-radius:12px; margin:0 16px; background:#111; cursor:zoom-in; }
  .lightbox-img-wrap img { width:100%; height:100%; object-fit:contain; transition:transform .15s ease; transform-origin:center center; background:#fff; }
  .lightbox-close { position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:999px; background:rgba(0,0,0,.4); color:#fff; border:none; font-size:1.1rem; z-index:6; }
  .lightbox-nav {
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:40px; height:40px; border-radius:999px; background:rgba(0,0,0,.4); color:#fff; border:none;
    font-size:1.2rem; font-weight:700; backdrop-filter:blur(2px); transition:background .15s ease;
  }
  .lightbox-nav:hover { background:rgba(0,0,0,.6); }
  .lightbox-nav-prev { left:10px; }
  .lightbox-nav-next { right:10px; }
  .lightbox-dots { position:absolute; bottom:12px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:6; }
  .lightbox-dots span { width:6px; height:6px; border-radius:999px; background:rgba(255,255,255,.5); }
  .lightbox-dots span.active { background:#fff; width:16px; }

  /* ---------- Cartão de boas-vindas ---------- */
  .welcome-overlay {
    position:fixed; inset:0; z-index:999; background:rgba(30,32,20,0.78);
    display:flex; align-items:center; justify-content:center; padding:16px;
    animation:fade .25s ease;
  }
  .welcome-card-wrap {
    max-width:480px; width:100%; max-height:92vh; overflow-y:auto;
    background:#4b4e37; border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.45);
    display:flex; flex-direction:column; align-items:center; padding:14px 14px 22px;
    animation:modalIn .3s ease-out;
  }
  .welcome-card-img { width:100%; height:auto; border-radius:14px; display:block; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .welcome-btn {
    margin-top:18px; padding:14px 30px; border-radius:999px; border:none;
    background:var(--cream); color:var(--olive-deep); font-weight:700; font-size:.92rem;
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .welcome-btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.38); background:#fff; }
  .welcome-btn:active { transform:translateY(0); }
  @media(max-width:480px){
    .welcome-card-wrap { padding:10px 10px 18px; border-radius:16px; max-height:94vh; }
    .welcome-btn { width:100%; justify-content:center; padding:13px 22px; font-size:.88rem; }
  }

  /* ---------- Melhorias mobile ---------- */
  @media(max-width:640px){
    body { -webkit-tap-highlight-color: transparent; }
    .min-h-screen { padding-left:14px !important; padding-right:14px !important; padding-top:18px !important; }
    button, .input-field, select { font-size:16px; } /* evita zoom automático em iOS ao focar input */
    .modal-enter, .card.p-6 { padding:18px !important; }
    .produto-card .p-3 { padding:10px !important; }
    .tab-btn { padding:13px 8px; font-size:.85rem; }
  }
  @media(max-width:480px){
    .produto-zoom-btn, .produto-nav-btn { width:26px; height:26px; }
  }
  @media (hover: none) {
    .produto-zoom-btn { background:rgba(58,60,44,.65); }
  }

  .input-field, input[type=file] { border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:.9rem; width:100%; margin-bottom:0; }

  @media(max-width:520px){
    .card { flex-direction:column; }
    .card-img { width:100%; height:auto; max-height:340px; object-fit:contain; background:var(--cream-dim); }
    .card-img-placeholder { width:100%; height:180px; }
    .perf { width:100%; height:4px; background-size:8px 8px; }
  }
</style>
</head>

<div id="root"></div>
<script>
function mostrarErroFatal(msg) {
  var root = document.getElementById('root');
  root.innerHTML = '<div style="color:#3a3c2c;background:#f7f5ee;font-family:sans-serif;padding:24px;white-space:pre-wrap;">⚠ Erro ao carregar:\n\n' + msg + '</div>';
}
window.addEventListener('error', function (e) {
  mostrarErroFatal(e.message || e);
});
window.addEventListener('unhandledrejection', function (e) {
  mostrarErroFatal((e.reason && (e.reason.message || JSON.stringify(e.reason))) || e.reason);
});
</script>

function fmtBRL(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function fmtDate(dataISO, hora) {
  const d = new Date(dataISO + 'T' + (hora || '00:00'));
  return d.toLocaleDateString('pt-BR') + ' às ' + (hora || '').slice(0,5);
}

function buildOrderMessage(ev, paymentMethod, nomeCompleto) {
  return [
    ORDER_MARKER,
    `Nome: ${nomeCompleto}`,
    `Evento: ${ev.nome}`,
    `Data: ${fmtDate(ev.data, ev.hora)}`,
    `Valor: ${fmtBRL(ev.preco)}`,
    `Pagamento: ${paymentMethod}`,
  ].join('\n');
}
async function registrarMulher(nomeCompleto, telCliente, cpfCliente, nascCliente) {
  const { data, error } = await supabase.from('mv_mulheres').insert({
    nome: nomeCompleto,
    tel: telCliente,
    cpf: cpfCliente,
    data_nascimento: nascCliente,
    consentimento_marketing: true,
    consentimento_data: new Date().toISOString()
  }).select('id').single();

  if (!error) return data.id;

  if (error.code === '23505') {
    // já existe (nome ou CPF duplicado) — busca o id existente pra vincular a pendência
    const { data: existente } = await supabase.from('mv_mulheres')
      .select('id').ilike('nome', nomeCompleto).maybeSingle();
    return existente ? existente.id : null;
  }

  console.error('Erro ao cadastrar mulher:', error);
  return null;
}

async function registrarPendencia(mulherId, ev, formaPagamento) {
  if (!mulherId) return;
  const { error } = await supabase.from('mv_pendencias').insert({
    mulher_id: mulherId,
    evento_id: ev.id,
    forma_pagamento: formaPagamento,
    valor: ev.preco,
    status: 'pendente'
  });
  if (error) console.error('Erro ao registrar pendência:', error);
}

function isNomeValido(v) { return v.trim().split(/\s+/).length >= 2; }
function isTelValido(v) { return v.replace(/\D/g, '').length >= 10; }

// Validação real de CPF (dígitos verificadores), não só o tamanho.
function isCpfValido(v) {
  var cpf = String(v).replace(/\D/g, '');
  if (cpf.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(cpf)) return false; // sequências tipo 111.111.111-11
  function digito(base) {
    var soma = 0, peso = base.length + 1;
    for (var i = 0; i < base.length; i++) { soma += parseInt(base[i], 10) * peso; peso--; }
    var resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  }
  if (digito(cpf.slice(0, 9)) !== parseInt(cpf[9], 10)) return false;
  if (digito(cpf.slice(0, 10)) !== parseInt(cpf[10], 10)) return false;
  return true;
}

function maskCPF(v) {
  v = v.replace(/\D/g, '').slice(0, 11);
  if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  return v;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function loadProdutos() {
  // Lista explícita de colunas (nunca "*"): a coluna "custo" é bloqueada para
  // visitantes no banco de dados, então um select('*') quebraria o catálogo.
  const { data, error } = await supabase.from('mv_produtos')
    .select('id,nome,descricao,preco,tem_variacao,estoque,imagem_url,ativo,mv_produto_variacoes(*),mv_produto_imagens(*)')
    .eq('ativo', true).order('nome');
  if (error) { console.error(error); return []; }
  data.forEach(p => {
    const galeria = (p.mv_produto_imagens || []).slice().sort((a, b) => a.ordem - b.ordem).map(im => im.url);
    p._imagens = galeria.length > 0 ? galeria : (p.imagem_url ? [p.imagem_url] : []);
  });
  return data;
}

// ------------------ Carrinho ------------------
function cartKey(produtoId, variacaoId) { return produtoId + '|' + (variacaoId || ''); }

function cartAdd(produto, variacao, quantidade) {
  const key = cartKey(produto.id, variacao ? variacao.id : null);
  const estoqueMax = variacao ? variacao.estoque : (produto.estoque == null ? 999 : produto.estoque);
  const existente = state.cart.find(it => it.key === key);
  if (existente) {
    existente.quantidade = Math.min(existente.quantidade + quantidade, estoqueMax);
  } else {
    state.cart.push({
      key, produtoId: produto.id, produtoNome: produto.nome,
      variacaoId: variacao ? variacao.id : null, variacaoNome: variacao ? variacao.nome : null,
      preco: Number(produto.preco) || 0, quantidade: Math.min(quantidade, estoqueMax), estoqueMax
    });
  }
}
function cartSetQty(key, qty) {
  const it = state.cart.find(x => x.key === key);
  if (!it) return;
  it.quantidade = Math.max(1, Math.min(qty, it.estoqueMax));
}
function cartRemove(key) { state.cart = state.cart.filter(it => it.key !== key); }
function cartTotal() { return state.cart.reduce((s, it) => s + it.preco * it.quantidade, 0); }
function cartCount() { return state.cart.reduce((s, it) => s + it.quantidade, 0); }

function buildOrderMessageProdutos(itens, formaPagamento, nomeCompleto, valorTotal) {
  const linhas = itens.map(it => `• ${it.quantidade}x ${it.produtoNome}${it.variacaoNome ? ' (' + it.variacaoNome + ')' : ''} — ${fmtBRL(it.preco * it.quantidade)}`);
  return [
    ORDER_MARKER_PRODUTO,
    `Nome: ${nomeCompleto}`,
    'Itens:',
    ...linhas,
    `Total: ${fmtBRL(valorTotal)}`,
    `Pagamento: ${formaPagamento}`,
  ].join('\n');
}

async function registrarPedidoLoja(mulherId, itens, valorTotal, formaPagamento) {
  const itensSnapshot = itens.map(it => ({
    produto_id: it.produtoId, produto_nome: it.produtoNome,
    variacao_id: it.variacaoId || null, variacao_nome: it.variacaoNome || null,
    quantidade: it.quantidade, preco_unitario: it.preco
  }));
  const { error } = await supabase.from('mv_pedidos_loja').insert({
    mulher_id: mulherId, itens: itensSnapshot, valor_total: valorTotal, forma_pagamento: formaPagamento, status: 'pendente'
  });
  if (error) console.error('Erro ao registrar pedido da loja:', error);
}

async function loadEvents() {
  const { data, error } = await supabase.from('mv_eventos').select('*');
  if (error) { console.error(error); return []; }
  const abertos = data.filter(e => e.status === 'aberto').sort((a,b) => a.data.localeCompare(b.data));
  const finalizados = data.filter(e => e.status !== 'aberto').sort((a,b) => b.data.localeCompare(a.data));
  return abertos.concat(finalizados);
}

let destaquesIntervalId = null;

function iniciarAutoplayDestaques() {
  if (destaquesIntervalId) return;
  destaquesIntervalId = setInterval(() => {
    if (!state.destaques || state.destaques.length < 2) return;
    state.destaqueIndex = (state.destaqueIndex + 1) % state.destaques.length;
    render();
  }, 5500);
}

function irParaDestaque(i) {
  if (!state.destaques || state.destaques.length === 0) return;
  state.destaqueIndex = ((i % state.destaques.length) + state.destaques.length) % state.destaques.length;
  render();
}

function abrirDestaque(d) {
  if (d.tipo_link === 'loja') {
    state.tab = 'produtos';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (d.tipo_link === 'evento' && d.evento_id) {
    const ev = state.events.find(e => e.id === d.evento_id);
    if (ev) {
      state.tab = 'eventos';
      state.detalhesEvent = ev;
      render();
    }
  } else if (d.tipo_link === 'url' && d.url_externa) {
    window.open(d.url_externa, '_blank', 'noopener');
  }
}

function renderDestaques(wrap) {
  const container = wrap.querySelector('#destaquesWrap');
  if (!container) return;
  if (!state.destaques || state.destaques.length === 0) { container.innerHTML = ''; return; }

  const slidesHtml = state.destaques.map((d, i) => {
    const clicavel = d.tipo_link && d.tipo_link !== 'nenhum';
    return `<div class="destaque-slide ${i === state.destaqueIndex ? 'active' : ''} ${clicavel ? 'clickable' : ''}"
                 style="background-color:${d.cor_fundo || '#5c6146'};background-image:url('${d.imagem_url}')"
                 data-destaque-index="${i}">
      <div class="destaque-overlay">
        <p class="destaque-titulo">${escapeHtml(d.titulo)}</p>
        ${d.subtitulo ? `<p class="destaque-subtitulo">${escapeHtml(d.subtitulo)}</p>` : ''}
      </div>
    </div>`;
  }).join('');

  const dotsHtml = state.destaques.length > 1
    ? `<div class="destaques-dots">${state.destaques.map((_, i) =>
        `<button data-dot="${i}" class="${i === state.destaqueIndex ? 'active' : ''}" aria-label="Destaque ${i + 1}"></button>`
      ).join('')}</div>`
    : '';

  const arrowsHtml = state.destaques.length > 1 ? `
    <button class="destaques-arrow prev" data-arrow="prev" aria-label="Anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="destaques-arrow next" data-arrow="next" aria-label="Próximo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>` : '';

  container.innerHTML = `<div class="destaques-wrap">${slidesHtml}${dotsHtml}${arrowsHtml}</div>`;

  container.querySelectorAll('.destaque-slide.clickable').forEach(el => {
    el.addEventListener('click', () => abrirDestaque(state.destaques[Number(el.dataset.destaqueIndex)]));
  });
  container.querySelectorAll('[data-dot]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); irParaDestaque(Number(btn.dataset.dot)); });
  });
  const prevBtn = container.querySelector('[data-arrow="prev"]');
  const nextBtn = container.querySelector('[data-arrow="next"]');
  if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); irParaDestaque(state.destaqueIndex - 1); });
  if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); irParaDestaque(state.destaqueIndex + 1); });

  iniciarAutoplayDestaques();
}

function renderProdutosGrid(wrap) {
  const grid = wrap.querySelector('#produtos-grid');
  if (state.produtosLoading) {
    grid.innerHTML = `<div style="color:var(--olive);grid-column:1/-1;">Carregando produtos...</div>`;
    return;
  }
  if (state.produtos.length === 0) {
    grid.innerHTML = `<div class="card p-8 text-center" style="color:var(--olive);grid-column:1/-1;">Nenhum produto disponível no momento.</div>`;
    return;
  }
  grid.innerHTML = '';
  state.produtos.forEach(p => {
    const variacoes = (p.mv_produto_variacoes || []).filter(v => v.estoque > 0);
    const semEstoque = p.tem_variacao ? variacoes.length === 0 : (p.estoque != null && p.estoque <= 0);
    const imagens = p._imagens && p._imagens.length > 0 ? p._imagens : null;
    let imgIdx = 0;

    const variantSelectHtml = p.tem_variacao
      ? `<select class="input-field text-sm mt-2 variacao-select" data-produto-id="${p.id}" ${semEstoque ? 'disabled' : ''}>
          ${variacoes.map(v => `<option value="${v.id}">${escapeHtml(v.nome)} (${v.estoque} em estoque)</option>`).join('')}
         </select>`
      : '';
    const card = document.createElement('div');
    card.className = 'produto-card';

    const imgAreaHtml = imagens
      ? `<div class="produto-img-wrap">
          <img src="${imagens[0]}" class="produto-img" alt="${p.nome}">
          <button type="button" class="produto-zoom-btn" title="Ampliar">🔍</button>
          ${imagens.length > 1 ? `
            <button type="button" class="produto-nav-btn produto-nav-prev">‹</button>
            <button type="button" class="produto-nav-btn produto-nav-next">›</button>
            <div class="produto-dots">${imagens.map((_, i) => `<span class="${i === 0 ? 'active' : ''}"></span>`).join('')}</div>
          ` : ''}
        </div>`
      : `<div class="produto-img-wrap"><div class="produto-img-placeholder"><img src="data:image/png;base64,${LOGO_ICON_B64}" style="width:40px;opacity:.35;"></div></div>`;

    card.innerHTML = `
      ${imgAreaHtml}
      <div class="p-3 flex-1 flex flex-col">
        <div class="display" style="font-size:.95rem;font-weight:500;color:var(--ink);">${escapeHtml(p.nome)}</div>
        ${p.descricao ? `<div style="font-size:.78rem;color:var(--olive);margin-top:2px;">${escapeHtml(p.descricao)}</div>` : ''}
        ${variantSelectHtml}
        <div class="flex items-center justify-between mt-2">
          <div class="font-bold" style="color:var(--sage-dark);font-size:1rem;">${fmtBRL(p.preco)}</div>
          <div class="qty-stepper" data-produto-id="${p.id}">
            <button type="button" class="qty-menos">−</button>
            <span class="qty-valor">1</span>
            <button type="button" class="qty-mais">+</button>
          </div>
        </div>
        <button class="add-cart-btn btn-primary w-full mt-3 py-2 rounded-lg text-sm font-semibold" data-produto-id="${p.id}" ${semEstoque ? 'disabled' : ''}>
          ${semEstoque ? 'Sem estoque' : 'Adicionar ao carrinho'}
        </button>
      </div>
    `;
    grid.appendChild(card);

    if (imagens) {
      const imgEl = card.querySelector('.produto-img');
      const dots = card.querySelectorAll('.produto-dots span');
      function setImg(i) {
        imgIdx = (i + imagens.length) % imagens.length;
        imgEl.src = imagens[imgIdx];
        dots.forEach((d, di) => d.classList.toggle('active', di === imgIdx));
      }
      const prevBtn = card.querySelector('.produto-nav-prev');
      const nextBtn = card.querySelector('.produto-nav-next');
      if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); setImg(imgIdx - 1); });
      if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); setImg(imgIdx + 1); });
      const openZoom = () => { state.lightbox = { imagens, index: imgIdx, nome: p.nome }; render(); };
      card.querySelector('.produto-zoom-btn').addEventListener('click', (e) => { e.stopPropagation(); openZoom(); });
      imgEl.addEventListener('click', openZoom);
    }

    if (semEstoque) return;

    const qtyStepper = card.querySelector('.qty-stepper');
    const qtyValor = qtyStepper.querySelector('.qty-valor');
    function maxAtual() {
      if (!p.tem_variacao) return p.estoque == null ? 999 : p.estoque;
      const sel = card.querySelector('.variacao-select');
      const v = variacoes.find(x => x.id === (sel ? sel.value : null));
      return v ? v.estoque : 1;
    }
    qtyStepper.querySelector('.qty-mais').addEventListener('click', () => {
      const atual = parseInt(qtyValor.textContent, 10);
      qtyValor.textContent = Math.min(atual + 1, maxAtual());
    });
    qtyStepper.querySelector('.qty-menos').addEventListener('click', () => {
      const atual = parseInt(qtyValor.textContent, 10);
      qtyValor.textContent = Math.max(1, atual - 1);
    });
    const selectEl = card.querySelector('.variacao-select');
    if (selectEl) selectEl.addEventListener('change', () => { qtyValor.textContent = '1'; });

    card.querySelector('.add-cart-btn').addEventListener('click', () => {
      const qtd = parseInt(qtyValor.textContent, 10) || 1;
      let variacao = null;
      if (p.tem_variacao) {
        const sel = card.querySelector('.variacao-select');
        variacao = variacoes.find(v => v.id === sel.value);
        if (!variacao) return;
      }
      cartAdd(p, variacao, qtd);
      render();
    });
  });
}

function renderLightbox(wrap) {
  const lb = state.lightbox;
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  const temVarias = lb.imagens.length > 1;
  overlay.innerHTML = `
    <div class="lightbox-img-wrap">
      <img src="${lb.imagens[lb.index]}" alt="${lb.nome}">
      <button type="button" class="lightbox-close">✕</button>
      ${temVarias ? `
        <button type="button" class="lightbox-nav lightbox-nav-prev">‹</button>
        <button type="button" class="lightbox-nav lightbox-nav-next">›</button>
        <div class="lightbox-dots">${lb.imagens.map((_, i) => `<span class="${i === lb.index ? 'active' : ''}"></span>`).join('')}</div>
      ` : ''}
    </div>
  `;
  wrap.appendChild(overlay);

  const imgWrap = overlay.querySelector('.lightbox-img-wrap');
  const img = imgWrap.querySelector('img');

  // Zoom seguindo o mouse (só em telas com mouse de verdade)
  const podeAmpliar = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (podeAmpliar) {
    imgWrap.addEventListener('mousemove', (e) => {
      const rect = imgWrap.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      img.style.transformOrigin = `${x}% ${y}%`;
      img.style.transform = 'scale(2.2)';
    });
    imgWrap.addEventListener('mouseleave', () => { img.style.transform = 'scale(1)'; });
  } else {
    imgWrap.addEventListener('click', () => {
      img.style.transform = img.style.transform === 'scale(2)' ? 'scale(1)' : 'scale(2)';
    });
  }

  function irPara(i) { state.lightbox.index = (i + lb.imagens.length) % lb.imagens.length; render(); }
  overlay.querySelector('.lightbox-close').addEventListener('click', () => { state.lightbox = null; render(); });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) { state.lightbox = null; render(); } });
  const navPrev = overlay.querySelector('.lightbox-nav-prev');
  const navNext = overlay.querySelector('.lightbox-nav-next');
  if (navPrev) navPrev.addEventListener('click', () => irPara(lb.index - 1));
  if (navNext) navNext.addEventListener('click', () => irPara(lb.index + 1));
}

      <label style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--olive);font-weight:600;display:block;margin-bottom:8px;">Forma de pagamento</label>
      <div class="flex gap-2 mb-5">
        <button data-method="Pix" class="pay-btn btn-outline flex-1 py-2 rounded-lg text-sm font-medium">Pix</button>
        <button data-method="Cartão de crédito" class="pay-btn btn-outline flex-1 py-2 rounded-lg text-sm font-medium">Cartão</button>
      </div>
      <button id="close-modal" class="text-xs underline" style="color:var(--olive);">cancelar</button>
    </div>`;
  wrap.appendChild(overlay);

  overlay.querySelector('#input-cpf').addEventListener('input', (e) => { e.target.value = maskCPF(e.target.value); });

  overlay.querySelectorAll('.pay-btn').forEach(btn => btn.addEventListener('click', async () => {
    const nome = overlay.querySelector('#input-nome').value.trim();
    const tel = overlay.querySelector('#input-tel').value.trim();
    const cpf = overlay.querySelector('#input-cpf').value.trim();
    const nasc = overlay.querySelector('#input-nasc').value;
    const consentiu = overlay.querySelector('#input-consentimento').checked;
    if (!isNomeValido(nome)) { state.modalError = 'Informe seu nome completo (nome e sobrenome).'; render(); return; }
    if (!isTelValido(tel)) { state.modalError = 'Informe um WhatsApp válido, com DDD.'; render(); return; }
    if (!isCpfValido(cpf)) { state.modalError = 'Informe um CPF válido.'; render(); return; }
    if (!nasc) { state.modalError = 'Informe sua data de nascimento.'; render(); return; }
    if (!consentiu) { state.modalError = 'É preciso autorizar o uso dos dados para continuar.'; render(); return; }
    state.modalError = '';
    btn.disabled = true;
    btn.textContent = 'Aguarde...';

    // Abre a aba/janela JÁ no clique (antes de qualquer await), pra não ser bloqueada
    // pelo navegador em celulares — o endereço é preenchido só depois.
    const novaJanela = window.open('', '_blank');

    const mulherId = await registrarMulher(nome, tel, cpf, nasc);
    await registrarPendencia(mulherId, ev, btn.dataset.method);

    const msg = buildOrderMessage(ev, btn.dataset.method, nome);
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    if (novaJanela) {
      novaJanela.location.href = url;
    } else {
      // fallback: se o navegador bloqueou mesmo assim, navega a própria aba
      window.location.href = url;
    }
    state.modalEvent = null;
    render();
  }));
  overlay.querySelector('#close-modal').addEventListener('click', () => { state.modalEvent = null; state.modalError = ''; render(); });
}

function renderCartDrawer(wrap) {
  const drawer = document.createElement('div');
  drawer.className = 'cart-drawer' + (state.cartExpanded ? ' expanded' : '');

  const itensHtml = state.cart.map(it => `
    <div class="flex items-center justify-between gap-2" style="padding:10px; margin-bottom:8px; background:var(--cream); border-radius:12px;">
      <div class="flex-1">
        <div style="font-size:.88rem;font-weight:600;color:var(--ink);">${escapeHtml(it.produtoNome)}${it.variacaoNome ? ' <span style="color:var(--olive);font-weight:400;">(' + escapeHtml(it.variacaoNome) + ')</span>' : ''}</div>
        <div style="font-size:.78rem;color:var(--olive);">${fmtBRL(it.preco)} cada</div>
      </div>
      <div class="qty-stepper" data-key="${it.key}">
        <button type="button" class="cart-qty-menos">−</button>
        <span class="qty-valor">${it.quantidade}</span>
        <button type="button" class="cart-qty-mais">+</button>
      </div>
      <div style="font-weight:700;font-size:.85rem;min-width:64px;text-align:right;color:var(--sage-dark);">${fmtBRL(it.preco * it.quantidade)}</div>
      <button class="cart-remove" data-key="${it.key}" style="color:var(--rose-dark);width:26px;height:26px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.75rem;flex-shrink:0;">✕</button>
    </div>
  `).join('');

  const cf = state.checkoutForm;
  drawer.innerHTML = `
    <button type="button" class="cart-drawer-header">
      <span style="display:flex;align-items:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Carrinho <span class="badge">${cartCount()}</span>
      </span>
      <span style="display:flex;align-items:center;gap:8px;">
        ${fmtBRL(cartTotal())}
        <span class="cart-drawer-chevron">▲</span>
      </span>
    </button>
    <div class="cart-drawer-body">
      <div id="cart-itens">${itensHtml}</div>

      <div class="flex items-center justify-between mt-1 mb-4">
        <div style="font-size:.9rem;color:var(--olive);">Total</div>
        <div style="font-weight:700;font-size:1.15rem;color:var(--sage-dark);">${fmtBRL(cartTotal())}</div>
      </div>

      <label style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--olive);font-weight:600;display:block;margin-bottom:5px;">Nome completo</label>
      <input id="cart-nome" type="text" placeholder="Seu nome completo" class="input-field mb-3" value="${escapeHtml(cf.nome)}">

      <label style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--olive);font-weight:600;display:block;margin-bottom:5px;">WhatsApp</label>
      <input id="cart-tel" type="tel" placeholder="(71) 99999-9999" class="input-field mb-3" value="${escapeHtml(cf.tel)}">

      <label style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--olive);font-weight:600;display:block;margin-bottom:5px;">CPF</label>
      <input id="cart-cpf" type="text" placeholder="000.000.000-00" maxlength="14" class="input-field mb-3" value="${escapeHtml(cf.cpf)}">

      <label style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--olive);font-weight:600;display:block;margin-bottom:5px;">Data de nascimento</label>
      <input id="cart-nasc" type="date" class="input-field mb-3" value="${escapeHtml(cf.nasc)}">

      <div style="color:var(--rose-dark);font-size:.78rem;min-height:1em;margin-bottom:8px;">${state.checkoutError || ''}</div>

      <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;">
        <input id="cart-consentimento" type="checkbox" style="margin-top:3px;" ${cf.consentimento ? 'checked' : ''}>
        <label for="cart-consentimento" style="font-size:.78rem;color:var(--ink);font-weight:400;">
          Autorizo o uso dos meus dados (nome, CPF, data de nascimento e WhatsApp) para
          confirmar este pedido e para receber comunicações sobre futuros eventos e
          campanhas do Mulheres que Voam.
        </label>
      </div>

      <label style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--olive);font-weight:600;display:block;margin-bottom:8px;">Forma de pagamento</label>
      <div class="flex gap-2">
        <button data-method="Pix" class="cart-pay-btn btn-outline flex-1 py-2 rounded-lg text-sm font-medium">Pix</button>
        <button data-method="Cartão de crédito" class="cart-pay-btn btn-outline flex-1 py-2 rounded-lg text-sm font-medium">Cartão</button>
      </div>
    </div>
  `;
  wrap.appendChild(drawer);

  drawer.querySelector('.cart-drawer-header').addEventListener('click', () => {
    state.cartExpanded = !state.cartExpanded;
    render();
  });

  if (!state.cartExpanded) return;

  drawer.querySelectorAll('.qty-stepper').forEach(stepper => {
    const key = stepper.dataset.key;
    const item = state.cart.find(it => it.key === key);
    stepper.querySelector('.cart-qty-mais').addEventListener('click', (e) => { e.stopPropagation(); cartSetQty(key, item.quantidade + 1); render(); });
    stepper.querySelector('.cart-qty-menos').addEventListener('click', (e) => {
      e.stopPropagation();
      if (item.quantidade <= 1) { cartRemove(key); } else { cartSetQty(key, item.quantidade - 1); }
      render();
    });
  });
  drawer.querySelectorAll('.cart-remove').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); cartRemove(btn.dataset.key); render(); });
  });

  // Mantém os dados digitados salvos no estado, mesmo que o carrinho seja
  // redesenhado (por exemplo ao mudar a quantidade de um item).
  const campoNome = drawer.querySelector('#cart-nome');
  const campoTel = drawer.querySelector('#cart-tel');
  const campoCpf = drawer.querySelector('#cart-cpf');
  const campoNasc = drawer.querySelector('#cart-nasc');
  const campoConsentimento = drawer.querySelector('#cart-consentimento');
  campoNome.addEventListener('input', () => { state.checkoutForm.nome = campoNome.value; });
  campoTel.addEventListener('input', () => { state.checkoutForm.tel = campoTel.value; });
  campoCpf.addEventListener('input', () => { campoCpf.value = maskCPF(campoCpf.value); state.checkoutForm.cpf = campoCpf.value; });
  campoNasc.addEventListener('input', () => { state.checkoutForm.nasc = campoNasc.value; });
  campoConsentimento.addEventListener('change', () => { state.checkoutForm.consentimento = campoConsentimento.checked; });

  drawer.querySelectorAll('.cart-pay-btn').forEach(btn => btn.addEventListener('click', async () => {
    const nome = campoNome.value.trim();
    const tel = campoTel.value.trim();
    const cpf = campoCpf.value.trim();
    const nasc = campoNasc.value;
    const consentiu = campoConsentimento.checked;
    if (!isNomeValido(nome)) { state.checkoutError = 'Informe seu nome completo (nome e sobrenome).'; render(); return; }
    if (!isTelValido(tel)) { state.checkoutError = 'Informe um WhatsApp válido, com DDD.'; render(); return; }
    if (!isCpfValido(cpf)) { state.checkoutError = 'Informe um CPF válido.'; render(); return; }
    if (!nasc) { state.checkoutError = 'Informe sua data de nascimento.'; render(); return; }
    if (!consentiu) { state.checkoutError = 'É preciso autorizar o uso dos dados para continuar.'; render(); return; }
    state.checkoutError = '';
    btn.disabled = true;
    btn.textContent = 'Aguarde...';

    const novaJanela = window.open('', '_blank');

    const mulherId = await registrarMulher(nome, tel, cpf, nasc);
    const itensPedido = state.cart.slice();
    const total = cartTotal();
    await registrarPedidoLoja(mulherId, itensPedido, total, btn.dataset.method);

    const msg = buildOrderMessageProdutos(itensPedido, btn.dataset.method, nome, total);
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    if (novaJanela) { novaJanela.location.href = url; } else { window.location.href = url; }

    state.cart = [];
    state.cartExpanded = false;
    state.checkoutForm = { nome: '', tel: '', cpf: '', nasc: '', consentimento: false };
    render();
  }));
}

function renderWelcomeOverlay(wrap) {
  const overlay = document.createElement('div');
  overlay.className = 'welcome-overlay';
  overlay.innerHTML = `
    <div class="welcome-card-wrap">
      <img src="data:image/jpeg;base64,${WELCOME_CARD_B64}" alt="Mulheres que Voam" class="welcome-card-img">
      <button type="button" class="welcome-btn" id="btn-seguir-catalogo">
        Seguir para o catálogo
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  `;
  wrap.appendChild(overlay);

  function fechar() {
    state.showWelcome = false;
    try { sessionStorage.setItem('mqv_welcome_seen', '1'); } catch (e) {}
    render();
  }
  overlay.querySelector('#btn-seguir-catalogo').addEventListener('click', fechar);
}

(async () => {
  try {
    const [events, destaques, whatsappConfig] = await Promise.all([loadEvents(), loadDestaques(), loadWhatsappNumber()]);
    state.events = events;
    state.destaques = destaques;
    if (whatsappConfig) { WHATSAPP_NUMBER = whatsappConfig; }
    state.loading = false;
    render();
  } catch (err) {
    console.error(err);
    root.innerHTML = '<div style="color:#3a3c2c;background:#f7f5ee;font-family:sans-serif;padding:24px;white-space:pre-wrap;">⚠ Erro ao carregar o catálogo:\n\n' + (err.message || err) + '</div>';
  }
})();
</script>
</body>
</html>
